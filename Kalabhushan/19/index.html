<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17091e" />
    <title>Happy Birthday Kunjnu!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="photo-show" aria-hidden="true">
      <div class="photo photo-1"></div>
      <div class="photo photo-2"></div>
      <div class="photo photo-3"></div>
      <div class="photo photo-4"></div>
      <div class="photo photo-5"></div>
      <div class="photo photo-6"></div>
      <div class="photo photo-7"></div>
      <div class="photo photo-8"></div>
      <div class="photo photo-9"></div>
      <div class="photo photo-10"></div>
    </div>

    <div class="backdrop"></div>
    <div class="stars" aria-hidden="true"></div>
    <div id="glitter" aria-hidden="true"></div>

    <main>
      <p class="eyebrow">A day to celebrate you</p>

      <h1>
        Happy Birthday<br />
        <span>Kunjnu</span>
      </h1>

      <p class="subtitle">
        May this year bring another beautiful year of adventures, laughter and
        dreams coming true.
      </p>

      <section class="cake-scene" aria-label="A birthday cake with number 19 candles">
        <div class="glow"></div>

        <div class="cake-wrap">
          <div class="flame flame-one"><i></i></div>
          <div class="flame flame-nine"><i></i></div>

          <div class="number-candles">
            <span>1</span>
            <span>9</span>
          </div>

          <div class="cake">
            <div class="layer birthday-layer"><span>Happy Birthday</span></div>
            <div class="layer"></div><div class="layer"></div><div class="layer"></div>
            <div class="layer"></div><div class="layer"></div><div class="layer"></div>
            <div class="layer"></div><div class="layer"></div>
            <div class="layer plate"></div>
          </div>
        </div>
      </section>

      <p class="wish">
        Keep shining, keep smiling, keep being wonderfully you!
        <span>✦</span>
      </p>

      <button id="celebrate" type="button">
        Make a wish <span>✦</span>
      </button>
    </main>

    <div id="confetti" aria-hidden="true"></div>
    <script src="script.js"></script>
  </body>
</html>
