<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">
<title>Happy Birthday 🎉</title>


<style>
@import url('https://fonts.googleapis.com/css2?family=Ephesis&family=Monsieur+La+Doulaise&family=Tangerine:wght@400;700&display=swap');
/* ---------- GLOBAL ---------- */
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    perspective: 1200px;
}

/* ---------- COUNTDOWN ---------- */
#countdown {
    position: absolute;
    font-size: 120px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 30px rgba(0,0,0,0.3);
    animation: pop 1s ease-in-out infinite;
}

@keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    50% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.3); opacity: 0; }
}

/* ---------- MAIN CONTENT ---------- */
#scene {
    display: none;
    text-align: center;
    transform-style: preserve-3d;
}

/* ---------- TEXT ---------- */
/* h1 {
    position: absolute;
    font-size: 64px;
    color: white;
    margin-bottom: 40px;
    text-shadow: 0 5px 20px rgba(0,0,0,0.3);
    animation: glow 2s infinite alternate;
    top: -300%;
    width: 100%;
    text-align: center;
} */

@keyframes glow {
    from { text-shadow: 0 0 10px #fff; }
    to { text-shadow: 0 0 30px #ff69b4; }
}

/* ---------- CAKE ---------- */
.cake {
    position: relative;
    width: 200px;
    height: 200px;
    transform-style: preserve-3d;
    animation: rotateCake 12s linear infinite;
    margin: auto;
}

@keyframes rotateCake {
    from { transform: rotateX(-45deg) rotateY(0deg); }
    to { transform: rotateX(-45deg) rotateY(360deg); }
}

/* Cake layers */
.layer {
    position: absolute;
    background: radial-gradient( circle 200px, #ffb347, #ffcc33);
    color: aliceblue;
    font-size: 80px;
    font-family: "Ephesis", cursive;
    font-weight: 600;
    font-style: normal;
    align-content: center;
    height: 500px;
    width: 500px;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translateX(-50%) translateY(-50%) rotateX(90deg) translateZ(100px);
    transform-style: preserve-3d;
}

.layer:nth-child(1) { top: 50%; }
.layer:nth-child(2) { top: 60%; background: radial-gradient(#ff6f91, #ff9671); }
.layer:nth-child(3) { top: 70%; background: radial-gradient(#fbc2eb, #a18cd1); }
.layer:nth-child(4) { top: 80%; }
.layer:nth-child(5) { top: 90%; background: radial-gradient(#ff6f91, #ff9671); }
.layer:nth-child(6) { top: 100%; background: radial-gradient(#fbc2eb, #a18cd1); }
.layer:nth-child(7) { top: 110%; }
.layer:nth-child(8) { top: 120%; background: radial-gradient(#ff6f91, #ff9671); }
.layer:nth-child(9) { top: 130%; background: radial-gradient(#fbc2eb, #a18cd1); }

/* ---------- CANDLE ---------- */
.candle {
    position: absolute;
    top: -50px;
    left: 90px;
    width: 20px;
    height: 50px;
    background: repeating-linear-gradient(
        45deg,
        #fff,
        #fff 5px,
        #ff4081 5px,
        #ff4081 10px
    );
    transform: translateZ(-120px);
    animation: rotateCandle 12s linear infinite;
}

@keyframes rotateCandle {
    from { transform: translateZ(-120px) rotateY(360deg); }
    to { transform: translateZ(-120px) rotateY(0deg); }
}

.flame {
    position: absolute;
    top: -25px;
    left: 5px;
    width: 10px;
    height: 30px;
    background: radial-gradient(circle, yellow, orange, red);
    border-radius: 50%;
    animation: flicker 0.2s infinite alternate;
}

.plate{
    top: 140%;
    height: 700px;
    width: 700px;
    background: radial-gradient(circle 300px, black, white);
}

@keyframes flicker {
    from { transform: scale(1); opacity: 0.9; }
    to { transform: scale(1.2); opacity: 1; }
}
/* ---------- GLITTER FALL ---------- */
.glitter-container {
    display: none;
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
}

.glitter {
    position: absolute;
    width: 30px;
    height: 30px;
    background: radial-gradient(circle, #fff, gold, transparent);
    /* border-radius: 10%; */
    opacity: 0.9;
    animation: fall linear infinite;
}
.pink{
        background: radial-gradient(circle, #fff, magenta, transparent);
}
.red{
        background: radial-gradient(circle, #fff, red, transparent);
}
.violet{
        background: radial-gradient(circle, #fff, violet, transparent);
}

@keyframes fall {
    from {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 1;
    }
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

</style>
</head>

<body>

<!-- Countdown -->
<div id="countdown">3</div>

<!-- Main Scene -->
<div id="scene">

    <div class="cake">
        <div class="layer">Happy Birthday Aswana</div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="layer plate"></div>

        <div class="candle">
            <div class="flame"></div>
        </div>
    </div>
</div>
<div class="glitter-container" id="glitterContainer"></div>

<!-- Music -->
<audio id="music" src="KALYANI.m4a" loop></audio>

<script>
/* ---------- COUNTDOWN LOGIC ---------- */
let count = 3;
const countdown = document.getElementById("countdown");
const scene = document.getElementById("scene");
const music = document.getElementById("music");
const glitterContainer = document.getElementById("glitterContainer");

const timer = setInterval(() => {
    count--;
    if (count > 0) {
        countdown.textContent = count;
    } else {
        clearInterval(timer);
        countdown.style.display = "none";
        glitterContainer.style.display = "block";
        scene.style.display = "block";
        music.play();
    }
}, 1000);


function createGlitter() {
    const glitter = document.createElement("div");
    glitter.classList.add("glitter");
    switch(parseInt(Math.random()*5)){
        case 0 : glitter.classList.add(""); break;
        case 1 : glitter.classList.add("red"); break;
        case 2 : glitter.classList.add("violet"); break;
        case 3 : glitter.classList.add("pink"); break;
    }

    glitter.style.left = Math.random() * 100 + "vw";
    glitter.style.animationDuration = (3 + Math.random() * 3) + "s";
    glitter.style.opacity = Math.random();
    glitter.style.transform = `scale(${Math.random() * 1.2 + 0.3})`;

    glitterContainer.appendChild(glitter);

    setTimeout(() => glitter.remove(), 12000);
}

// Start glitter after countdown
setInterval(createGlitter, 120);

</script>

</body>
</html>
